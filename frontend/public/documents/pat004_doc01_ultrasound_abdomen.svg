        <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">GALLBLADDER</text>
        <text x="210" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Normal distension, wall thickness 2.2mm, no calculi/sludge</text>
        <rect x="470" y="10" width="75" height="20" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/><text x="507" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803D" text-anchor="middle">VERIFIED</text>
      </g>
    
      <g transform="translate(40, 326)">
