        <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">KIDNEYS / SPLEEN</text>
        <text x="210" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Bilateral kidneys normal size and CMD. Spleen 9.8 cm (Normal)</text>
        
      </g>
    
      <g transform="translate(40, 374)">
