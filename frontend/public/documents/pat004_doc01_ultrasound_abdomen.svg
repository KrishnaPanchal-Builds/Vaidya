  <text x="40" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">PATIENT:</text>
  <text x="145" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">Sunita Sharma (45Y / Female)</text>
  
  <text x="420" y="136" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">DATE:</text>
  <text x="465" y="136" font-family="monospace" font-size="12" font-weight="600" fill="#0F172A">08-JUN-2025</text>

  <!-- Section Title -->
  <text x="40" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F766E" letter-spacing="1">STANDARDIZED CLINICAL DATA EXTRACT</text>
  <line x1="40" y1="212" x2="600" y2="212" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Fields List -->
  
      <g transform="translate(40, 230)">
        <rect x="0" y="0" width="560" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">LIVER</text>
        <text x="210" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Mild diffuse increase in parenchymal echogenicity (Grade 1 Fatty Liver)</text>
        <rect x="470" y="10" width="75" height="20" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/><text x="507" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803D" text-anchor="middle">VERIFIED</text>
      </g>
    
      <g transform="translate(40, 278)">
