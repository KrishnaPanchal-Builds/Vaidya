        <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">PELVIC ORGANS</text>
        <text x="210" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Uterus anteverted, normal myometrial echo-pattern, no adnexal mass</text>
        
      </g>
    
      <g transform="translate(40, 422)">
        <rect x="0" y="0" width="560" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">IMPRESSION</text>
        <text x="210" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Grade 1 Hepatic Steatosis. No evidence of cholelithiasis.</text>
        <rect x="470" y="10" width="75" height="20" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/><text x="507" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803D" text-anchor="middle">VERIFIED</text>
      </g>
    

  <!-- Footer & Digital Seal -->
  <g transform="translate(40, 680)">
