[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "traumabridge-backend"
version = "1.0.0"
description = "TraumaBridge AI — Pre-Hospital Emergency Telemetry Engine | SIH 2026 (Open Innovation)"
authors = ["TraumaBridge Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
gunicorn = "^22.0"
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
redis = {extras = ["hiredis"], version = "^5.0"}
groq = "^0.9"
httpx = "^0.27"
python-jose = {extras = ["cryptography"], version = "^3.3"}
cryptography = "^42.0"
aiofiles = "^23.2"
aiomqtt = "^2.1"
protobuf = "^4.25"
numpy = "^1.26"
python-multipart = "^0.0.9"
passlib = {extras = ["bcrypt"], version = "^1.7"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.14"
httpx = "^0.27"
anyio = "^4.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
